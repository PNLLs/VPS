<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS Bot Control Center</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #252538;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 { color: #89b4fa; margin-bottom: 5px; }
        h2 { color: #cba6f7; text-align: left; margin-top: 30px; font-size: 1.2em; border-bottom: 1px solid #45475a; padding-bottom: 5px; }
        .platform-badge {
            color: #a6e3a1;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status {
            display: inline-block;
            padding: 6px 14px;
            background: #a6e3a1;
            color: #11111b;
            border-radius: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            text-align: left;
        }
        .card {
            background: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #45475a;
        }
        .card h3 { margin: 0 0 10px 0; color: #cba6f7; font-size: 0.9em; text-transform: uppercase; }
        .card .value { font-size: 1.4em; font-weight: bold; color: #f5e0dc; }
        
        .bot-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            text-align: left;
        }
        .bot-item {
            background: #1e1e2e;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #45475a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bot-info { display: flex; flex-direction: column; }
        .bot-name { font-weight: bold; color: #cdd6f4; }
        .bot-meta { font-size: 0.8em; color: #6c7086; }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .badge-online { background: #a6e3a1; color: #11111b; }
        .badge-offline { background: #f38ba8; color: #11111b; }
        .badge-error { background: #fab387; color: #11111b; }
        .badge-kicked { background: #f9e2af; color: #11111b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VPS Bot Control Center</h1>
        <div class="platform-badge">Платформа: <span id="platform">Загрузка...</span></div>
        
        <div><div class="status">Сервер: Онлайн</div></div>

        <h2>Мониторинг Системы</h2>
        <div class="stats-grid">
            <div class="card">
                <h3>Загрузка памяти</h3>
                <div class="value" id="mem-percent">0%</div>
                <small style="color: #6c7086;">Занято: <span id="mem-details">0 / 0 MB</span></small>
            </div>
            <div class="card">
                <h3>Время работы (Uptime)</h3>
                <div class="value" id="uptime">0 сек</div>
                <small style="color: #6c7086;">Непрерывный аптайм</small>
            </div>
        </div>

        <h2>Discord Боты (×3)</h2>
        <div class="bot-list" id="discord-bot-list">
            <div style="color: #6c7086;">Загрузка статусов ботов...</div>
        </div>

        <h2>Minecraft Mineflayer Роботы (×3)</h2>
        <div class="bot-list" id="minecraft-bot-list">
            <div style="color: #6c7086;">Загрузка роботов...</div>
        </div>
    </div>

    <script>
        async function updateSystemStats() {
            try {
                const response = await fetch('/api/system');
                const data = await response.json();
                document.getElementById('platform').innerText = data.platform;
                document.getElementById('mem-percent').innerText = data.memory.percent;
                document.getElementById('mem-details').innerText = `${data.memory.used} / ${data.memory.total}`;
                const minutes = Math.round(data.uptimeSeconds / 60);
                document.getElementById('uptime').innerText = `${minutes} мин`;
            } catch (error) {
                console.error("Ошибка системы:", error);
            }
        }

        async function updateDiscordStats() {
            try {
                const response = await fetch('/api/discord');
                const bots = await response.json();
                const listContainer = document.getElementById('discord-bot-list');
                listContainer.innerHTML = '';

                bots.forEach(bot => {
                    let badgeClass = 'badge-offline';
                    let statusText = 'Выключен';
                    if (bot.status === 'online') { badgeClass = 'badge-online'; statusText = 'Онлайн'; }
                    else if (bot.status === 'error') { badgeClass = 'badge-error'; statusText = 'Ошибка'; }

                    listContainer.innerHTML += `
                        <div class="bot-item">
                            <div class="bot-info">
                                <span class="bot-name">${bot.name}</span>
                                <span class="bot-ping">Пинг: ${bot.ping} мс</span>
                            </div>
                            <span class="badge ${badgeClass}">${statusText}</span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Ошибка Discord API:", error);
            }
        }

        async function updateMinecraftStats() {
            try {
                const response = await fetch('/api/minecraft');
                const bots = await response.json();
                const listContainer = document.getElementById('minecraft-bot-list');
                listContainer.innerHTML = '';

                bots.forEach(bot => {
                    let badgeClass = 'badge-offline';
                    let statusText = 'Оффлайн';
                    if (bot.status === 'online') { badgeClass = 'badge-online'; statusText = 'В игре'; }
                    else if (bot.status === 'kicked') { badgeClass = 'badge-kicked'; statusText = 'Кикнут'; }
                    else if (bot.status === 'connecting') { badgeClass = 'badge-error'; statusText = 'Вход...'; }

                    listContainer.innerHTML += `
                        <div class="bot-item">
                            <div class="bot-info">
                                <span class="bot-name">${bot.username} <span style="color: #6c7086; font-size: 0.8em;">→ ${bot.targetServer}</span></span>
                                <span class="bot-meta">Здоровье: ❤️ ${bot.health}/20 | Добыто: 📦 ${bot.blocksMined} бл.</span>
                            </div>
                            <span class="badge ${badgeClass}">${statusText}</span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Ошибка Minecraft API:", error);
            }
        }

        // Первичный вызов
        updateSystemStats();
        updateDiscordStats();
        updateMinecraftStats();

        // Цикл обновления
        setInterval(() => {
            updateSystemStats();
            updateDiscordStats();
            updateMinecraftStats();
        }, 3000);
    </script>
</body>
</html>
